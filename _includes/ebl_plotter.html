<!-- Load Plotly.js -->
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

<div style="background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; padding: 16px; margin: 20px 0;">
  <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: center; margin-bottom: 15px;">
    <div>
      <label for="redshift-slider" style="font-weight: bold; margin-right: 8px;">
        Redshift ($z$): <span id="redshift-val" style="color: #007bff; font-weight: bold;">0.00</span>
      </label>
      <input type="range" id="redshift-slider" min="0" max="3.9" step="0.01" value="0" style="vertical-align: middle; width: 200px;">
    </div>
    
    <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center;">
      <span style="font-weight: bold; margin-right: 4px;">Backgrounds:</span>
      <label><input type="checkbox" id="cmb-check" checked>CMB</label>
      <label><input type="checkbox" class="model-check" value="11dominguez" checked> Domínguez 2011</label>
      <label><input type="checkbox" class="model-check" value="18franceschini" checked> Franceschini 2018</label>
      <label><input type="checkbox" class="model-check" value="21saldana" checked> Saldaña 2021</label>
      <label><input type="checkbox" class="model-check" value="22finke" checked> Finke 2022</label>
    </div>
  </div>

  <div id="ebl-plot-status" style="color: #6c757d; font-size: 0.9em; margin-bottom: 10px;">Loading data...</div>
  <div id="ebl-plot-container" style="width:100%; height:520px;"></div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
  const rawBaseUrl = "https://raw.githubusercontent.com/CAPICLE/GammaWeb/main/_data/ebl/";
  
  // Physical constants for CMB calculation
  const kB = 8.617333262e-5; // eV / K
  const T0 = 2.7255;          // K
  const kBT0 = kB * T0;       // eV (~2.3483e-4 eV)

  const modelFiles = {
    '11dominguez': { name: 'Domínguez et al. 2011', url: rawBaseUrl + '11dominguez.txt' },
    '18franceschini': { name: 'Franceschini et al. 2018', url: rawBaseUrl + '18franceschini.txt' },
    '21saldana': { name: 'Saldaña et al. 2021', url: rawBaseUrl + '21saldana.txt' },
    '22finke': { name: 'Finke et al. 2022', url: rawBaseUrl + '22finke.txt' }
  };

  const cachedData = {};
  const statusEl = document.getElementById('ebl-plot-status');
  const slider = document.getElementById('redshift-slider');
  const valSpan = document.getElementById('redshift-val');
  const cmbCheck = document.getElementById('cmb-check');

  function parseEBLFile(text) {
    const lines = text.trim().split('\n');
    let redshifts = [];
    const rows = [];

    for (let line of lines) {
      line = line.trim();
      if (line.startsWith('#')) {
        if (line.includes('Redshifts')) {
          const match = line.match(/Redshifts\s*=\s*\{([^}]+)\}/);
          if (match) {
            redshifts = match[1].split(',').map(s => parseFloat(s.trim()));
          }
        }
      } else if (line.length > 0) {
        const cols = line.split(/\s+/).map(Number);
        if (cols.length > 1 && !isNaN(cols[0])) rows.push(cols);
      }
    }

    const energies = rows.map(r => r[0]);
    const densities = rows.map(r => r.slice(1));
    return { redshifts, energies, densities };
  }

  function interpolateLogDensity(redshifts, rowDensities, targetZ) {
    if (targetZ <= redshifts[0]) return rowDensities[0];
    if (targetZ >= redshifts[redshifts.length - 1]) return rowDensities[rowDensities.length - 1];

    let idx = 0;
    while (idx < redshifts.length - 1 && redshifts[idx + 1] < targetZ) {
      idx++;
    }

    const z1 = redshifts[idx];
    const z2 = redshifts[idx + 1];
    const n1 = rowDensities[idx];
    const n2 = rowDensities[idx + 1];

    if (z1 === z2) return n1;
    if (n1 <= 0 || n2 <= 0) {
      const t = (targetZ - z1) / (z2 - z1);
      return n1 + t * (n2 - n1);
    }

    const t = (targetZ - z1) / (z2 - z1);
    return Math.exp((1 - t) * Math.log(n1) + t * Math.log(n2));
  }

  // Generate continuous energy array for smooth CMB rendering across the plot window
  function generateEnergyGrid(minExp, maxExp, points) {
    const arr = [];
    const step = (maxExp - minExp) / (points - 1);
    for (let i = 0; i < points; i++) {
      arr.push(Math.pow(10, minExp + i * step));
    }
    return arr;
  }

  function calculateCMB(energies, targetZ) {
    return energies.map(w => {
      const x = w / (kBT0 * (1 + targetZ));
      if (x > 700) return null;
      const nCMB = Math.pow(w / Math.PI, 2) / (Math.exp(x) - 1);
      return nCMB * Math.pow(w, 2);
    });
  }

  async function loadAllData() {
    let loadedCount = 0;
    
    for (const key of Object.keys(modelFiles)) {
      try {
        const response = await fetch(modelFiles[key].url);
        if (response.ok) {
          const text = await response.text();
          cachedData[key] = parseEBLFile(text);
          loadedCount++;
        }
      } catch (err) {
        console.error(`Error loading ${key}:`, err);
      }
    }

    if (loadedCount === 0) {
      statusEl.style.color = '#dc3545';
      statusEl.textContent = 'Could not fetch data from GitHub raw repository storage.';
      return;
    }

    statusEl.textContent = '';
    updatePlot();
  }

  function updatePlot() {
    const selectedRedshift = parseFloat(slider.value);
    const checkboxes = document.querySelectorAll('.model-check:checked');
    
    const traces = [];

    // Continuous fine energy grid for the CMB blackbody trace (10^-5 to 10^1.5 eV)
    const cmbEnergies = generateEnergyGrid(-5, 1.5, 300);

    // 1. Analytical CMB Spectrum
    if (cmbCheck.checked) {
      const cmbY = calculateCMB(cmbEnergies, selectedRedshift);
      traces.push({
        x: cmbEnergies,
        y: cmbY,
        mode: 'lines',
        name: 'CMB (Planck Blackbody)',
        line: { dash: 'dash', color: '#000000', width: 2 },
        hovertemplate: 'E: %{x:.4e} eV<br>n·ω²: %{y:.4e} eV⁴<extra></extra>'
      });
    }

    // 2. Tabulated EBL Models
    checkboxes.forEach(cb => {
      const key = cb.value;
      const data = cachedData[key];
      if (!data) return;

      const yValues = data.densities.map((row, i) => {
        const energy = data.energies[i];
        const interpolatedN = interpolateLogDensity(data.redshifts, row, selectedRedshift);
        return interpolatedN * Math.pow(energy, 2);
      });

      traces.push({
        x: data.energies,
        y: yValues,
        mode: 'lines',
        name: modelFiles[key].name,
        hovertemplate: 'E: %{x:.4e} eV<br>n·ω²: %{y:.4e} eV⁴<extra></extra>'
      });
    });

    const layout = {
      title: `Photon Energy Density Spectrum n(ω,z)·ω² at z = ${selectedRedshift.toFixed(2)}`,
      xaxis: {
        title: 'Photon Energy ω [eV]',
        type: 'log',
        range: [-5, 1.5], // Log10 range from 10^-5 to 10^1.5 (~31.6 eV)
        autorange: false
      },
      yaxis: {
        title: 'n(ω, z) · ω² [eV⁴]',
        type: 'log',
        range: [-18, -14], // Log10 range from 10^-18 to 10^-15 eV^4
        autorange: false
      },
      margin: { l: 65, r: 30, t: 40, b: 50 },
      hovermode: 'x unified'
    };

    Plotly.react('ebl-plot-container', traces, layout);
  }

  slider.addEventListener('input', function(e) {
    valSpan.textContent = parseFloat(e.target.value).toFixed(2);
  });

  slider.addEventListener('change', updatePlot);
  cmbCheck.addEventListener('change', updatePlot);
  document.querySelectorAll('.model-check').forEach(cb => cb.addEventListener('change', updatePlot));

  loadAllData();
});
</script>
