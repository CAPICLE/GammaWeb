<!-- Load Plotly.js -->
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

<div style="background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; padding: 16px; margin: 20px 0;">
  <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: center; margin-bottom: 15px;">
    <div>
      <label for="redshift-select" style="font-weight: bold; margin-right: 8px;">Redshift ($z$):</label>
      <select id="redshift-select" style="padding: 5px 10px; border-radius: 4px; border: 1px solid #ccc;">
        <option>Loading redshifts...</option>
      </select>
    </div>
    
    <div>
      <span style="font-weight: bold; margin-right: 8px;">Models:</span>
      <label style="margin-right: 10px;"><input type="checkbox" class="model-check" value="11dominguez" checked> Domínguez 2011</label>
      <label style="margin-right: 10px;"><input type="checkbox" class="model-check" value="18franceschini" checked> Franceschini 2018</label>
      <label style="margin-right: 10px;"><input type="checkbox" class="model-check" value="21saldana" checked> Saldaña 2021</label>
      <label style="margin-right: 10px;"><input type="checkbox" class="model-check" value="22finke" checked> Finke 2022</label>
    </div>
  </div>

  <div id="ebl-plot-status" style="color: #6c757d; font-size: 0.9em; margin-bottom: 10px;">Loading EBL data...</div>
  <div id="ebl-plot-container" style="width:100%; height:500px;"></div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
  // Direct fetch from raw GitHub repository storage
  const rawBaseUrl = "https://raw.githubusercontent.com/CAPICLE/GammaWeb/main/_data/ebl/";
  
  const modelFiles = {
    '11dominguez': { name: 'Domínguez et al. 2011', url: rawBaseUrl + '11dominguez.txt' },
    '18franceschini': { name: 'Franceschini et al. 2018', url: rawBaseUrl + '18franceschini.txt' },
    '21saldana': { name: 'Saldaña et al. 2021', url: rawBaseUrl + '21saldana.txt' },
    '22finke': { name: 'Finke et al. 2022', url: rawBaseUrl + '22finke.txt' }
  };

  const cachedData = {};
  let commonRedshifts = [];
  const statusEl = document.getElementById('ebl-plot-status');

  function parseEBLFile(text) {
    const lines = text.trim().split('\n');
    let redshifts = [];
    const rows = [];

    for (let line of lines) {
      line = line.trim();
      if (line.startsWith('#')) {
        if (line.includes('Redshifts')) {
          const match = line.match(/Redshifts\s*=\s*\{([^}]+)\}/);
          if (match) {
            redshifts = match[1].split(',').map(s => parseFloat(s.trim()));
          }
        }
      } else if (line.length > 0) {
        const cols = line.split(/\s+/).map(Number);
        if (cols.length > 1 && !isNaN(cols[0])) rows.push(cols);
      }
    }

    const energies = rows.map(r => r[0]);
    const densities = rows.map(r => r.slice(1));
    return { redshifts, energies, densities };
  }

  async function loadAllData() {
    let loadedCount = 0;
    
    for (const key of Object.keys(modelFiles)) {
      try {
        const response = await fetch(modelFiles[key].url);
        if (response.ok) {
          const text = await response.text();
          cachedData[key] = parseEBLFile(text);
          loadedCount++;
          if (commonRedshifts.length === 0 && cachedData[key].redshifts.length > 0) {
            commonRedshifts = cachedData[key].redshifts;
          }
        } else {
          console.error(`Failed to fetch ${modelFiles[key].url}: Status ${response.status}`);
        }
      } catch (err) {
        console.error(`Error loading ${key}:`, err);
      }
    }

    if (loadedCount === 0) {
      statusEl.style.color = '#dc3545';
      statusEl.textContent = 'Could not fetch data from GitHub raw repository storage.';
      return;
    }

    statusEl.textContent = '';
    populateRedshiftDropdown();
    updatePlot();
  }

  function populateRedshiftDropdown() {
    const select = document.getElementById('redshift-select');
    select.innerHTML = '';
    commonRedshifts.forEach((z, index) => {
      const opt = document.createElement('option');
      opt.value = index;
      opt.textContent = `z = ${z}`;
      select.appendChild(opt);
    });
  }

  function updatePlot() {
    const zIndex = parseInt(document.getElementById('redshift-select').value) || 0;
    const selectedRedshift = commonRedshifts[zIndex] ?? 0;
    const checkboxes = document.querySelectorAll('.model-check:checked');
    
    const traces = [];

    checkboxes.forEach(cb => {
      const key = cb.value;
      const data = cachedData[key];
      if (!data) return;

      const zIdx = data.redshifts.indexOf(selectedRedshift) !== -1
        ? data.redshifts.indexOf(selectedRedshift)
        : zIndex;

      const yValues = data.densities.map(row => row[zIdx]);

      traces.push({
        x: data.energies,
        y: yValues,
        mode: 'lines',
        name: modelFiles[key].name,
        hovertemplate: 'E: %{x:.4e} eV<br>n: %{y:.4e} eV²<extra></extra>'
      });
    });

    const layout = {
      title: `EBL Photon Density Spectrum at z = ${selectedRedshift}`,
      xaxis: { title: 'Photon Energy ω [eV]', type: 'log' },
      yaxis: { title: 'Number Density n(ω, z) [eV²]', type: 'log' },
      margin: { l: 65, r: 30, t: 40, b: 50 },
      hovermode: 'x unified'
    };

    Plotly.react('ebl-plot-container', traces, layout);
  }

  document.getElementById('redshift-select').addEventListener('change', updatePlot);
  document.querySelectorAll('.model-check').forEach(cb => cb.addEventListener('change', updatePlot));

  loadAllData();
});
</script>
