  <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: center; margin-bottom: 15px;">
    <div>
      <label for="redshift-slider" style="font-weight: bold; margin-right: 8px;">

      <label><input type="checkbox" class="model-check" value="22finke" checked> Finke 2022</label>
    </div>
  </div>

</div>
