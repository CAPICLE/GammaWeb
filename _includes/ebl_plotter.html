<!-- Load Plotly.js -->
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

<div style="background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; padding: 16px; margin: 20px 0;">
  <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: center; margin-bottom: 15px;">
    <div>
      <label for="redshift-slider" style="font-weight: bold; margin-right: 8px;">
        Redshift ($z$): <span id="redshift-val" style="color: #007bff; font-weight: bold;">0.00</span>
      </label>
      <input type="range" id="redshift-slider" min="0" max="3.9" step="0.01" value="0" style="vertical-align: middle; width: 220px;">
    </div>
    
    <div>
      <span style="font-weight: bold; margin-right: 8px;">Models:</span>
      <label style="margin-right: 10px;"><input type="checkbox" class="model-check" value="11dominguez" checked> Domínguez 2011</label>
      <label style="margin-right: 10px;"><input type="checkbox" class="model-check" value="18franceschini" checked> Franceschini 2018</label>
      <label style="margin-right: 10px;"><input type="checkbox" class="model-check" value="21saldana" checked> Saldaña 2021</label>
      <label style="margin-right: 10px;"><input type="checkbox" class="model-check" value="22finke" checked> Finke 2022</label>
    </div>
  </div>

  <div id="ebl-plot-status" style="color: #6c757d; font-size: 0.9em; margin-bottom: 10px;">Loading EBL data...</div>
  <div id="ebl-plot-container" style="width:100%; height:500px;"></div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
  const rawBaseUrl = "https://raw.githubusercontent.com/CAPICLE/GammaWeb/main/_data/ebl/";
  
  const modelFiles = {
    '11dominguez': { name: 'Domínguez et al. 2011', url: rawBaseUrl + '11dominguez.txt' },
    '18franceschini': { name: 'Franceschini et al. 2018', url: rawBaseUrl + '18franceschini.txt' },
    '21saldana': { name: 'Saldaña et al. 2021', url: rawBaseUrl + '21saldana.txt' },
    '22finke': { name: 'Finke et al. 2022', url: rawBaseUrl + '22finke.txt' }
  };

  const cachedData = {};
  const statusEl = document.getElementById('ebl-plot-status');
  const slider = document.getElementById('redshift-slider');
  const valSpan = document.getElementById('redshift-val');

  function parseEBLFile(text) {
    const lines = text.trim().split('\n');
    let redshifts = [];
    const rows = [];

    for (let line of lines) {
      line = line.trim();
      if (line.startsWith('#')) {
        if (line.includes('Redshifts')) {
          const match = line.match(/Redshifts\s*=\s*\{([^}]+)\}/);
          if (match) {
            redshifts = match[1].split(',').map(s => parseFloat(s.trim()));
          }
        }
      } else if (line.length > 0) {
        const cols = line.split(/\s+/).map(Number);
        if (cols.length > 1 && !isNaN(cols[0])) rows.push(cols);
      }
    }

    const energies = rows.map(r => r[0]);
    const densities = rows.map(r => r.slice(1));
    return { redshifts, energies, densities };
  }

  // 1. Log-linear interpolation of density n(ω, z) at continuous target redshift z
  function interpolateLogDensity(redshifts, rowDensities, targetZ) {
    if (targetZ <= redshifts[0]) return rowDensities[0];
    if (targetZ >= redshifts[redshifts.length - 1]) return rowDensities[rowDensities.length - 1];

    let idx = 0;
    while (idx < redshifts.length - 1 && redshifts[idx + 1] < targetZ) {
      idx++;
    }

    const z1 = redshifts[idx];
    const z2 = redshifts[idx + 1];
    const n1 = rowDensities[idx];
    const n2 = rowDensities[idx + 1];

    if (z1 === z2) return n1;

    // Linear fallback if non-positive values exist
    if (n1 <= 0 || n2 <= 0) {
      const t = (targetZ - z1) / (z2 - z1);
      return n1 + t * (n2 - n1);
    }

    // Log-linear interpolation in z: ln(n) = (1-t)ln(n1) + t*ln(n2)
    const t = (targetZ - z1) / (z2 - z1);
    return Math.exp((1 - t) * Math.log(n1) + t * Math.log(n2));
  }

  async function loadAllData() {
    let loadedCount = 0;
    
    for (const key of Object.keys(modelFiles)) {
      try {
        const response = await fetch(modelFiles[key].url);
        if (response.ok) {
          const text = await response.text();
          cachedData[key] = parseEBLFile(text);
          loadedCount++;
        }
      } catch (err) {
        console.error(`Error loading ${key}:`, err);
      }
    }

    if (loadedCount === 0) {
      statusEl.style.color = '#dc3545';
      statusEl.textContent = 'Could not fetch data from GitHub raw repository storage.';
      return;
    }

    statusEl.textContent = '';
    updatePlot();
  }

  function updatePlot() {
    const selectedRedshift = parseFloat(slider.value);
    const checkboxes = document.querySelectorAll('.model-check:checked');
    
    const traces = [];

    checkboxes.forEach(cb => {
      const key = cb.value;
      const data = cachedData[key];
      if (!data) return;

      // Compute n(ω, z) * ω² with log-interpolation at target z
      const yValues = data.densities.map((row, i) => {
        const energy = data.energies[i];
        const interpolatedN = interpolateLogDensity(data.redshifts, row, selectedRedshift);
        return interpolatedN * Math.pow(energy, 2);
      });

      traces.push({
        x: data.energies,
        y: yValues,
        mode: 'lines',
        name: modelFiles[key].name,
        hovertemplate: 'E: %{x:.4e} eV<br>n·ω²: %{y:.4e} eV⁴<extra></extra>'
      });
    });

    const layout = {
      title: `EBL Energy Density Spectrum n(ω,z)·ω² at z = ${selectedRedshift.toFixed(2)}`,
      xaxis: { title: 'Photon Energy ω [eV]', type: 'log' },
      yaxis: { title: 'n(ω, z) · ω² [eV⁴]', type: 'log' },
      margin: { l: 65, r: 30, t: 40, b: 50 },
      hovermode: 'x unified'
    };

    Plotly.react('ebl-plot-container', traces, layout);
  }

  // 2. Real-time number update while dragging
  slider.addEventListener('input', function(e) {
    valSpan.textContent = parseFloat(e.target.value).toFixed(2);
  });

  // 3. Re-render Plotly graph ONLY when user releases the slider handle
  slider.addEventListener('change', updatePlot);
  document.querySelectorAll('.model-check').forEach(cb => cb.addEventListener('change', updatePlot));

  loadAllData();
});
</script>
